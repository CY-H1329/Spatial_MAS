# Spatial MAS — MindCube config (Head + 3 specialists + reasoning).
#
# Specialists fixed set:
# - Qwen3-VL-4B (instance A)
# - Qwen3-VL-4B (instance B, same model but separate name)
# - SpatialReasoner (Qwen2.5-VL backbone)
#
# Run full MindCube test:
#   python scripts/evals/mas_pipeline/run_eval_mas.py \
#     --config scripts/evals/mas_pipeline/config_mas_mindcube_qwen_qwen_spatial_reasoner.yaml \
#     --benchmark mindcube --full_dataset
#
head_agent:
  runner: "gpu"
  backend: "llava"
  model_id: "llava-hf/llava-v1.6-mistral-7b-hf"
  device: "cuda"

reasoning_agent:
  runner: "gpu"
  model_id: "deepseek-community/deepseek-vl-7b-chat"
  device: "cuda"

specialists:
  qwen3_4b_a:
    runner: "gpu"
    backend: "qwen3"
    model_id: "Qwen/Qwen3-VL-4B-Instruct"
    device: "cuda"
  qwen3_4b_b:
    runner: "gpu"
    backend: "qwen3"
    model_id: "Qwen/Qwen3-VL-4B-Instruct"
    device: "cuda"
  spatial_reasoner:
    runner: "gpu"
    backend: "spatial_reasoner"
    model_id: "ccvl/SpatialReasoner"
    processor_id: "Qwen/Qwen2.5-VL-7B-Instruct"
    bf16: true
    device: "cuda"

dataset:
  benchmark: "mindcube"
  max_samples: 100
  test_samples: 5
  seed: 42

output:
  dir: "results/runs/mas_pipeline"

