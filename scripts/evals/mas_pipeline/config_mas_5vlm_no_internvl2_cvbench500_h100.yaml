# 5 VLM specialists on H100, without InternVL2 (remote-code InternLM2 is unstable with some transformers builds).
# Pool: Qwen3-VL-4B, Sa2VA-4B, LLaVA-1.5-7B, Qwen2-VL-7B, Qwen2.5-VL-7B
#
# Run:
#   export MAS_CANDIDATE_AGENTS="qwen3_4b,sa2va,llava4d,qwen2_vl,qwen25_vl"
#   python scripts/evals/mas_pipeline/run_eval_mas.py --config scripts/evals/mas_pipeline/config_mas_5vlm_no_internvl2_cvbench500_h100.yaml --benchmark cvbench --max_samples 500 --seed 42

head_agent:
  runner: "gpu"
  backend: "llava"
  model_id: "llava-hf/llava-v1.6-mistral-7b-hf"
  device: "cuda"

reasoning_agent:
  runner: "gpu"
  model_id: "deepseek-community/deepseek-vl-7b-chat"
  device: "cuda"

specialists:
  qwen3_4b:
    runner: "gpu"
    backend: "qwen3"
    model_id: "Qwen/Qwen3-VL-4B-Instruct"
    device: "cuda"
  sa2va:
    runner: "gpu"
    backend: "sa2va"
    model_id: "ByteDance/Sa2VA-4B"
    device: "cuda"
  llava4d:
    runner: "gpu"
    backend: "llava"
    model_id: "llava-hf/llava-1.5-7b-hf"
    device: "cuda"
  qwen2_vl:
    runner: "gpu"
    backend: "qwen2_vl"
    model_id: "Qwen/Qwen2-VL-7B-Instruct"
    device: "cuda"
  qwen25_vl:
    runner: "gpu"
    backend: "qwen25_vl"
    model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
    device: "cuda"

dataset:
  benchmark: "cvbench"
  max_samples: 500
  test_samples: 5
  seed: 42

output:
  dir: "results/runs/mas_pipeline_5vlm_no_internvl2"

